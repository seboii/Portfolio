name: portfolio

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SITE_URL: "${VITE_SITE_URL:-}"
        VITE_ALLOW_INDEX: "${VITE_ALLOW_INDEX:-false}"
    image: shakhobiddin-portfolio:local
    container_name: portfolio-web
    ports:
      - "127.0.0.1:${PORTFOLIO_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  cloudflared:
    image: "${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2026.10.0}"
    container_name: portfolio-cloudflared
    profiles: ["tunnel"]
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/cloudflared_token
    secrets:
      - cloudflared_token
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  cloudflared_token:
    file: "${CLOUDFLARED_TOKEN_FILE:-./.secrets/cloudflared-token.txt}"
