# Select the generated error page by the requested language.
map $uri $portfolio_not_found {
    default /404.html;
    ~^/en(?:/|$) /en/404.html;
    ~^/ru(?:/|$) /ru/404.html;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    autoindex off;

    # Keep directory redirects relative so Docker's published port is retained.
    absolute_redirect off;
    add_header Cache-Control "no-cache" always;

    error_page 404 $portfolio_not_found;
    error_page 403 =404 $portfolio_not_found;

    location = /404.html {
        internal;
    }

    location = /en/404.html {
        internal;
    }

    location = /ru/404.html {
        internal;
    }

    # Hashed Vite assets can stay cached across page reloads.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ^~ /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # Documents use directory URLs; arbitrary .html URLs must remain real 404s.
    location ~* \.html$ {
        internal;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
